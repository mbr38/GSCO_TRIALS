              - generic [ref=e923]:
                - generic [ref=e925]:
                  - paragraph [ref=e930]:
                    - strong [ref=e931]: Definition
                  - paragraph [ref=e936]: Sentinel-5P TROPOMI total-column CO — a marker of incomplete combustion (biomass burning, vehicle exhaust, residential heating). Long atmospheric lifetime (weeks) means CO signals can be transported hundreds of km from source, so the column is dominated by regional / global background and supplier-level attribution at fenceline is loose (audit §1.5 / IC_v4 §1.5). Best read as a regional combustion-context proxy, not as a supplier-specific emission measurement.
                  - paragraph [ref=e941]:
                    - strong [ref=e942]: Decision relevance
                  - paragraph [ref=e947]: Useful for biomass-burning regions and supply chains exposed to seasonal fire risk. Elevated CO without local industrial source often indicates transported smoke or wildfire impact rather than the supplier itself.
                  - paragraph [ref=e952]:
                    - strong [ref=e953]: Limitations
                  - paragraph [ref=e958]: Total-column rather than tropospheric — includes stratospheric background. Long atmospheric lifetime makes source attribution within the AOI buffer weak. Provenance carries column_to_surface_uncertainty = 'weak'.
                  - paragraph [ref=e963]:
                    - strong [ref=e964]: Regulatory / ESG alignment
                  - paragraph [ref=e969]: WHO Air Quality Guidelines (2021); UN SDG 3.9.1
                - generic [ref=e971]:
