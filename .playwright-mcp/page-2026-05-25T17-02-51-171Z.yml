                  - paragraph [ref=e706]:
                    - strong [ref=e707]: Definition
                  - paragraph [ref=e712]: Sentinel-5P TROPOMI tropospheric column NO₂ — a primary pollutant emitted by combustion (vehicle exhaust, power plants, industrial flares). Strongly correlated with local emission sources.
                  - paragraph [ref=e717]:
                    - strong [ref=e718]: Decision relevance
                  - paragraph [ref=e723]: High-priority indicator for sites flagged as combustion-heavy. Elevated NO₂ around a supplier indicates active combustion sources — useful for verifying whether reported emissions controls are functioning.
                  - paragraph [ref=e728]:
                    - strong [ref=e729]: Limitations
                  - paragraph [ref=e734]: Sentinel-5P has ~1 km native L3 grid but a true retrieval footprint of ~3.5 × 5.5 km; not suitable for buffers smaller than ~5 km. Tropospheric column conflates ground-level concentration with vertical mixing — can over-state surface pollution under stable atmospheric conditions.
                  - paragraph [ref=e739]:
                    - strong [ref=e740]: Regulatory / ESG alignment
                  - paragraph [ref=e745]: WHO Air Quality Guidelines (2021); EU Ambient Air Quality Directive; UN SDG 11.6.2
                - generic [ref=e747]:
