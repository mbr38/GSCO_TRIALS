                  - paragraph [ref=e2361]: "Headline Air pillar score. Weighted sum of four sub-aggregates: pollution proxy (0.35) + spatiotemporal anomaly (0.30) + trend (0.20, screening = 0) + attribution confidence (0.15). Tertile-banded red / amber / green per Appendix C."
