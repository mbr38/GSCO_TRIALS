                  - paragraph [ref=e1048]: Sentinel-5P TROPOMI tropospheric column formaldehyde — a secondary pollutant produced by VOC photochemistry. Indicator of upstream VOC emissions from petrochemicals, biomass burning, and biogenic sources.
                  - paragraph [ref=e1053]:
                    - strong [ref=e1054]: Decision relevance
                  - paragraph [ref=e1059]: Tier-2 supply-chain risk indicator for petrochemical and refining nodes. Elevated HCHO indicates active VOC chemistry, even when direct VOC measurements aren't available.
                  - paragraph [ref=e1064]:
                    - strong [ref=e1065]: Limitations
                  - paragraph [ref=e1070]: Secondary pollutant — spatial peak displaced from emission source by atmospheric transport. Biogenic background (isoprene from forests) can be high in tropical regions and isn't an anthropogenic signal.
