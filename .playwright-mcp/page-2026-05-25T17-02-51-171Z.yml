                  - paragraph [ref=e824]: Sentinel-5P TROPOMI tropospheric column SO₂ — a marker of coal combustion, smelting, and oil refining. Strongly localised around point sources; useful for detecting unreported flaring.
                  - paragraph [ref=e829]:
                    - strong [ref=e830]: Decision relevance
                  - paragraph [ref=e835]: Flag for fossil-fuel processing facilities, metal smelters, and refineries. Persistent SO₂ anomalies indicate active combustion outside reported emissions inventories.
                  - paragraph [ref=e840]:
                    - strong [ref=e841]: Limitations
                  - paragraph [ref=e846]: Retrieval has high noise floor; reliable detection typically requires concentrated point sources. Background-level SO₂ over rural / clean-air regions returns near the noise floor and shouldn't be over-interpreted.
                  - paragraph [ref=e851]:
                    - strong [ref=e852]: Regulatory / ESG alignment
                  - paragraph [ref=e857]: WHO Air Quality Guidelines (2021); EU Industrial Emissions Directive; UN SDG 3.9.1
