            - generic [ref=f7e450]:
              - heading "Composite score methodology" [level=2] [ref=f7e451]
              - paragraph [ref=f7e452]:
                - text: The
                - strong [ref=f7e453]: overall screening composite
                - text: "is the equal-weighted mean of the three pillar follow-up-priority scores (Indicators_Computation_v4 §4):"
              - paragraph [ref=f7e454]:
                - emphasis [ref=f7e455]: composite = ( Air priority + GHG priority + Nature priority ) ÷ 3
              - paragraph [ref=f7e456]:
                - text: Scores run 0–1; bands are 0.66+ red (audit-first), 0.33–0.66 amber (investigate), <0.33 green (routine). If any pillar could not be computed the composite is left undefined rather than averaged over the survivors. Composite
                - emphasis [ref=f7e457]: confidence
                - text: is the minimum of the pillar confidences (IC_v4 §4).
              - paragraph [ref=f7e458]:
                - text: "Each pillar's follow-up priority has the same two-level shape (M-WEIGHTS-HARMONISE-A1):"
                - emphasis [ref=f7e459]: 0.80 · severity core + 0.20 · measurement quality
                - text: ", with the 0.20 measurement-quality weight shared across all three pillars and only the severity core differing by pillar. The tables below show the resulting effective per-term weights:"
