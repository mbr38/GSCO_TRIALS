            - generic [ref=f7e507]:
              - heading "Glossary" [level=2] [ref=f7e508]
              - paragraph [ref=f7e509]:
                - emphasis [ref=f7e510]: Plain-language definitions of the terms used in this report.
              - heading "Statistical" [level=3] [ref=f7e511]
              - generic [ref=f7e512]:
                - term [ref=f7e513]: z-score (σ)
                - definition [ref=f7e514]: How far a value sits from its local average, measured in standard-deviation units.
                - term [ref=f7e515]: percentile
                - definition [ref=f7e516]: Where a value falls in a ranked distribution (90th percentile = higher than 90% of the rest).
              - heading "Methodological" [level=3] [ref=f7e517]
              - generic [ref=f7e518]:
                - term [ref=f7e519]: AOI / buffer
                - definition [ref=f7e520]: The circular area screened around the site (centre plus radius).
                - term [ref=f7e521]: anomaly
                - definition [ref=f7e522]: A value departing from the local norm by more than the set threshold (2σ).
                - term [ref=f7e523]: follow-up priority score
                - definition [ref=f7e524]: The per-pillar severity ranking the tool produces; a measure of severity, not certainty.
                - term [ref=f7e525]: measurement quality / attribution confidence
                - definition [ref=f7e526]: How trustworthy a measurement is, kept deliberately separate from severity (the M-ATTRIB-A1 split).
                - term [ref=f7e527]: attributability
                - definition [ref=f7e528]: Whether an observed signal can plausibly be linked to the specific site, versus drifting in from elsewhere (wind, regional background). Context only; never enters the score.
                - term [ref=f7e529]: composite / overall screening score
                - definition [ref=f7e530]: The blend of the three pillar priority scores.
              - heading "Domain / dataset" [level=3] [ref=f7e531]
              - generic [ref=f7e532]:
                - term [ref=f7e533]: NDVI
                - definition [ref=f7e534]: A vegetation-health index from satellite reflectance; higher means greener / healthier.
                - term [ref=f7e535]: AAI (Absorbing Aerosol Index)
                - definition [ref=f7e536]: A measure of UV-absorbing aerosols such as smoke and dust.
                - term [ref=f7e537]: AOD (Aerosol Optical Depth)
                - definition [ref=f7e538]: How much aerosol blocks light through the atmospheric column.
                - term [ref=f7e539]: Dynamic World classes
                - definition [ref=f7e540]: Google's nine satellite land-cover categories (Water, Trees, Crops, Built, etc.).
                - term [ref=f7e541]: TROPOMI / Sentinel-5P
                - definition [ref=f7e542]: The satellite instrument behind the gas measurements (NO₂, SO₂, CO, HCHO, O₃, CH₄).
                - term [ref=f7e543]: VIIRS nightlights
                - definition [ref=f7e544]: Night-time light intensity, used as an industrial / urban activity proxy.
                - term [ref=f7e545]: KBA (Key Biodiversity Area)
                - definition [ref=f7e546]: Designated biodiversity-important sites (BirdLife International).
                - term [ref=f7e547]: Hansen / ODIAC
                - definition [ref=f7e548]: Reference datasets (forest loss; CO₂ emissions) shown as context, not scored.
                - term [ref=f7e549]: ESRS E1 / E2 / E4
                - definition [ref=f7e550]: The EU disclosure standards for Climate / Pollution / Biodiversity.
