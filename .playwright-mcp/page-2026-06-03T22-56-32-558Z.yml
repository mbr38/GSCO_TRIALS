              - heading "Methodology" [level=2] [ref=f7e31]
              - paragraph [ref=f7e32]: The GSCO Environmental Monitoring tool computes environmental screening across three pillars — Air Pollution, Greenhouse Gas Emissions, and Nature/Land — drawing on satellite earth-observation data via Google Earth Engine, scientific reference datasets, and emissions inventory products.
              - paragraph [ref=f7e33]: "Each pillar produces a 0–1 follow-up priority score. Bands: 0.66+ = red (audit-first), 0.33–0.66 = amber (investigate), < 0.33 = green (routine). Confidence is reported alongside each score and reflects coverage, retrieval quality, and spatial-temporal applicability."
              - paragraph [ref=f7e34]:
                - strong [ref=f7e35]: How to read severity (attributability framing).
                - text: Severity scores measure whether a site shows unusual pollution
                - emphasis [ref=f7e36]: relative to its surrounding region
                - text: — not absolute pollution levels. A low (green) rating means the site is not standing out from its surroundings, even where the wider region is itself polluted; an amber or red rating means the site stands out as anomalous against its regional context, suggesting a site-specific contribution worth investigating. This applies to the Air pillar's satellite indicators and the equivalent anomaly grammars elsewhere. Reference datasets (CH₄, Hansen, ODIAC) are shown for context and do not feed the scores.
